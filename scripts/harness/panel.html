<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>diffui-bb plugin — dev harness</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Map bb's theme tokens onto the Play CDN so the real panel classes
      // (text-muted-foreground, bg-surface-recessed, …) resolve here too.
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: "var(--background)",
              foreground: "var(--foreground)",
              "muted-foreground": "var(--muted-foreground)",
              "surface-recessed": "var(--surface-recessed)",
              "state-hover": "var(--state-hover)",
              destructive: "var(--destructive)",
              ring: "var(--ring)",
              border: "var(--border)",
            },
            borderColor: { DEFAULT: "var(--border)" },
            ringColor: { DEFAULT: "var(--ring)" },
          },
        },
      };
    </script>
    <style>
      /* bb's light theme tokens (harness approximation): warm chrome, cream
         recessed surfaces — the same custom properties the real bb host
         defines, which the plugin's canvas consumes untouched. */
      :root,
      :root[data-theme="light"] {
        --background: #fbfaf7;
        --foreground: #262420;
        --muted-foreground: #7a746b;
        --surface-recessed: #f2eee5;
        --state-hover: #edeadf;
        --destructive: #c9503c;
        --ring: #5c6cf0;
        --border: #e3ddd0;
      }
      /* bb's dark theme (harness approximation). Flipping data-theme is all it
         takes for the plugin's canvas to follow, because every canvas colour is
         a mix of the tokens above. */
      :root[data-theme="dark"] {
        --background: #16151a;
        --foreground: #ece9e3;
        --muted-foreground: #98928a;
        --surface-recessed: #1e1d23;
        --state-hover: #2a2831;
        --destructive: #ff6b5c;
        --ring: #8b9bff;
        --border: #322f39;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font: 14px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #shell {
        display: flex;
        height: 100%;
      }
      #rail {
        width: 232px;
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        flex-shrink: 0;
        min-height: 0;
      }
      #rail .top {
        padding: 12px 10px 6px;
      }
      #newThread {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        height: 32px;
        padding: 0 10px;
        box-sizing: border-box;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--background);
        color: var(--foreground);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      #rail nav {
        padding: 6px 10px;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      #rail .row {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 30px;
        padding: 0 8px;
        border-radius: 7px;
        color: var(--muted-foreground);
        font-size: 13px;
      }
      #rail .row svg {
        flex-shrink: 0;
      }
      #rail .row.active {
        background: var(--state-hover);
        color: var(--foreground);
      }
      #rail .threadsLabel {
        padding: 10px 18px 4px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted-foreground);
      }
      #railThreads {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
      }
      #main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      #titlebar {
        border-bottom: 1px solid var(--border);
        padding: 7px 14px;
        min-height: 38px;
        box-sizing: border-box;
        font-size: 13px;
        color: var(--muted-foreground);
        display: flex;
        gap: 10px;
        align-items: center;
        flex-shrink: 0;
      }
      #titlebarPluginContent {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      #themeToggle {
        margin-left: auto;
        height: 24px;
        padding: 0 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: transparent;
        color: var(--foreground);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      #titlebar b {
        color: var(--foreground);
        font-weight: 600;
      }
      #harness-note {
        font-size: 11px;
        color: var(--muted-foreground);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #harness-banner {
        display: none;
        margin: 10px 14px 0;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface-recessed);
        font-size: 12px;
      }
      #root {
        flex: 1;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <div id="shell">
      <aside id="rail">
        <div class="top">
          <button id="newThread" type="button">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
            New thread
          </button>
        </div>
        <nav>
          <div class="row">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 3 8 21"/><path d="M16 3l-2.5 18"/><path d="M3.5 9h17"/><path d="M3 15h17"/></svg>
            Extensions
          </div>
          <div class="row">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.2 2.2M16.9 16.9l2.2 2.2M4.9 19.1l2.2-2.2M16.9 7.1l2.2-2.2"/></svg>
            Automations
          </div>
          <div class="row active">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>
            Diffui
          </div>
        </nav>
        <div class="threadsLabel">Threads</div>
        <div id="railThreads"></div>
      </aside>
      <div id="main">
        <div id="titlebar">
          <b>Diffui</b>
          <!-- The plugin's `headerContent`, rendered by the host inside its own
               (and only) title bar. The panel below ships no second bar. -->
          <span id="titlebarPluginContent"></span>
          <span id="harness-note">bb-plugin-diffui-bb — dev harness (real plugin frontend + backend; bb desktop unavailable in this VM)</span>
          <button id="themeToggle" type="button">Dark</button>
        </div>
        <div id="harness-banner"></div>
        <div id="root"></div>
      </div>
    </div>
    <script>
      // Stands in for bb flipping its own theme: retune the host tokens and let
      // the plugin's canvas follow them.
      (() => {
        const toggle = document.getElementById("themeToggle");
        const root = document.documentElement;
        // The label names the theme the button switches TO, read off the current
        // state so it can never drift out of step with it.
        const label = () => (root.dataset.theme === "dark" ? "Light" : "Dark");
        const apply = (theme) => {
          root.dataset.theme = theme;
          toggle.textContent = label();
        };
        apply("light");
        toggle.addEventListener("click", () => {
          apply(root.dataset.theme === "dark" ? "light" : "dark");
        });
      })();
    </script>
    <script type="module" src="/panel.js"></script>
  </body>
</html>
